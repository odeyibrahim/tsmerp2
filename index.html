    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EIO</title>
    <!--
    SOURCES:
    1. EIO – ERP mockup.html - shell, typography, palette, components, JavaScript idiom, guide, plans, website, glossary, module map
    2. EIO Systems.html - dashboard, generic module registry + form/list engine, reports suite, settings tabs, booking calendar, master data, document/service expiry badges, purchase invoices, employee payment ledger, live tracking grid map
    3. EIO.html - travel booking, VAT 7.5%, part payments, payment-link modal (Paystack/Flutterwave), roles, plans with vehicle limits, Nigeria SVG map, settings with company + dropdown lists, driver/customer statements, day-book reports
    4. NaijaHaul project - fleet.js (fuelAnalysis, rateKmpl, vehicleFuelSummary, livePlans, dueStatus, expiryState, tyreKmRun), payroll.js (periodSheet in kobo, monthStart, shiftMonth, monthLabel, toCsv), reminders.js (THRESHOLDS, bandFor, stale-after-30-days, email digest)
    
    DEMO-ONLY SET:
    - File upload (stores filename/size/type only, no actual bytes)
    - Email reminders (builds digest from real data, doesn't send)
    - Paystack/Flutterwave checkout (fake gateway screen, simulated payment)
    - Live GPS map (positions simulated from bookings in transit)
    - Sign-in screen (no real auth, prototype only)
    - Company switcher (single localStorage, clones seed data)
    -->

    <script>
        'use strict';
        /* ---------------- helpers ---------------- */
        var $ = function(s, r) { return (r || document).querySelector(s); };
        var esc = function(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
        var uid = function() { return Math.random().toString(36).slice(2, 9); };
        var DAY = 86400000;
        var dayNum = function(s) { return Math.floor(Date.parse(String(s).slice(0, 10) + 'T00:00:00Z') / DAY); };
        var iso = function(n) { var d = new Date(); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
        var TD = iso(0);
        var ngn = function(n) { return '₦' + Math.round(Number(n) || 0).toLocaleString('en-NG'); };
        var num = function(n, d) { d = d || 0; return (Number(n) || 0).toLocaleString('en-NG', { minimumFractionDigits: d, maximumFractionDigits: d }); };
        var has = function(v) { return v !== null && v !== undefined && v !== ''; };
        var daysBetween = function(a, b) { return dayNum(b) - dayNum(a); };
        var monthStart = function(d) { return String(d).slice(0, 7) + '-01'; };
        var monthLabel = function(p) { return new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(monthStart(p) + 'T00:00:00Z')); };
        var shiftMonth = function(p, n) { var d = new Date(monthStart(p) + 'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7) + '-01'; };

        /* ---------------- fleet + payroll maths ---------------- */
        var SOON_DAYS = 14, SOON_KM = 1000, EXPIRY_DAYS = 30, LOW_RATIO = 0.7, GOOD_RATIO = 0.9;

        function expiryState(d, today) {
            var days = daysBetween(today, d);
            return { days: days, state: days < 0 ? 'expired' : days <= EXPIRY_DAYS ? 'soon' : 'valid' };
        }

        function dueState(m, odo, today) {
            var rank = 0, why = [];
            if (m.next) {
                var d = daysBetween(today, m.next);
                if (d < 0) { rank = 2; why.push((-d) + 'd overdue'); } else if (d <= SOON_DAYS) { rank = Math.max(rank, 1); why.push(d === 0 ? 'due today' : ('due in ' + d + 'd')); }
            }
            if (has(m.next_km) && has(odo)) {
                var left = Number(m.next_km) - Number(odo);
                if (left <= 0) { rank = 2; why.push(Math.abs(left) + 'km past'); } else if (left <= SOON_KM) { rank = Math.max(rank, 1); why.push(left + 'km to go'); }
            }
            return { state: rank === 2 ? 'overdue' : rank === 1 ? 'soon' : 'ok', why: why.join(' · ') };
        }

        function fuelAnalysis(logs) {
            var by = {}, out = {};
            logs.forEach(function(l) { if (!has(l.odo)) return; (by[l.vehicle] = by[l.vehicle] || []).push(l); });
            Object.keys(by).forEach(function(v) {
                var list = by[v].slice().sort(function(a, b) { return Number(a.odo) - Number(b.odo) || String(a.date).localeCompare(String(b.date)); });
                var last = null, litres = 0, measured = [];
                list.forEach(function(l) {
                    var odo = Number(l.odo);
                    if (last !== null) litres += Number(l.litres);
                    if (l.full === false || l.full === 'false') return;
                    if (last !== null && odo > last && litres > 0) {
                        var k = Math.round(((odo - last) / litres) * 100) / 100;
                        var rec = { kmpl: k, low: false };
                        out[l.id] = rec;
                        measured.push(rec);
                    }
                    last = odo;
                    litres = 0;
                });
                if (measured.length >= 3) {
                    var sorted = measured.map(function(r) { return r.kmpl; }).sort(function(a, b) { return a - b; });
                    var med = sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
                    measured.forEach(function(r) { r.low = r.kmpl < med * LOW_RATIO; });
                }
            });
            return out;
        }

        function rateKmpl(k, e) {
            if (!has(k) || !has(e) || Number(e) <= 0) return null;
            var r = Math.round((Number(k) / Number(e)) * 1000000) / 1000000;
            return r >= GOOD_RATIO ? 'good' : r >= LOW_RATIO ? 'medium' : 'bad';
        }

        var PAY_KINDS = [
            ['salary', 'Salary'], ['allowance', 'Allowance'], ['bonus', 'Bonus'], ['advance', 'Advance'], ['deduction', 'Deduction']
        ];
        var PAY_LABELS = {};
        PAY_KINDS.forEach(function(x) { PAY_LABELS[x[0]] = x[1]; });

        function periodSheet(entries, people) {
            var rows = {};

            function row(id, name) { if (!rows[id]) rows[id] = { id: id, name: name, salary: 0, allowance: 0, bonus: 0, advance: 0, deduction: 0 }; return rows[id]; }
            people.forEach(function(p) { row(p.id, p.name); });
            entries.forEach(function(e) { if (e.deleted_at || !PAY_LABELS[e.kind]) return; row(e.employee, '(archived)')[e.kind] += Math.round((Number(e.amount) || 0) * 100); });
            var out = Object.keys(rows).map(function(id) {
                var r = rows[id], cents = { salary: r.salary, allowance: r.allowance, bonus: r.bonus, advance: r.advance, deduction: r.deduction };
                var gross = cents.salary + cents.allowance + cents.bonus, net = gross - cents.advance - cents.deduction;
                return { id: id, name: r.name, salary: cents.salary / 100, allowance: cents.allowance / 100, bonus: cents.bonus / 100, advance: cents.advance / 100, deduction: cents.deduction / 100, gross: gross / 100, net: net / 100 };
            }).sort(function(a, b) { return a.name.localeCompare(b.name); });
            var t = { salary: 0, allowance: 0, bonus: 0, advance: 0, deduction: 0, gross: 0, net: 0 };
            out.forEach(function(r) { t.salary += Math.round(r.salary * 100); t.allowance += Math.round(r.allowance * 100); t.bonus += Math.round(r.bonus * 100); t.advance += Math.round(r.advance * 100); t.deduction += Math.round(r.deduction * 100); t.gross += Math.round(r.gross * 100); t.net += Math.round(r.net * 100); });
            Object.keys(t).forEach(function(k) { t[k] = t[k] / 100; });
            return { rows: out, totals: t };
        }

        function payrollCsv(s) {
            function cell(v) { var s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
            var head = ['Employee', 'Salary', 'Allowance', 'Bonus', 'Advance', 'Deduction', 'Gross', 'Net'];

            function line(n, r) { return [n, Number(r.salary).toFixed(2), Number(r.allowance).toFixed(2), Number(r.bonus).toFixed(2), Number(r.advance).toFixed(2), Number(r.deduction).toFixed(2), Number(r.gross).toFixed(2), Number(r.net).toFixed(2)].map(cell).join(','); }
            return [head.map(cell).join(',')].concat(s.rows.map(function(r) { return line(r.name, r); })).concat([line('TOTAL', s.totals)]).join('\n');
        }

        /* ---------------- reminders ---------------- */
        var THRESHOLDS = [30, 14, 7, 1, 0];
        var REMINDER_LOG = {};

        function bandFor(days) {
            if (days < -30) return null;
            var best = null;
            THRESHOLDS.forEach(function(t) { if (days <= t && (best === null || t < best)) best = t; });
            return best;
        }

        function addDays(d, n) { var x = new Date(dayNum(d) * DAY); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }

        function reminderItems(today) {
            var items = [];
            D.documents.forEach(function(d) {
                var v = g('vehicles', d.vehicle);
                if (!v) return;
                var e = expiryState(d.expires, today);
                if (e.state !== 'valid') { var band = bandFor(e.days); if (band !== null) items.push({ kind: 'document', ref: d.id, label: v.plate + ' ' + d.type, date: d.expires, days: e.days, band: band }); }
            });
            D.maintenance.forEach(function(m) {
                var v = g('vehicles', m.vehicle);
                if (!v) return;
                var s = dueState(m, v.odo, today);
                if (s.state !== 'ok' && m.next) { var d2 = daysBetween(today, m.next); var band = bandFor(d2); if (band !== null) items.push({ kind: 'maintenance', ref: m.id, label: v.plate + ' ' + m.kind, date: m.next, days: d2, band: band }); }
            });
            D.drivers.forEach(function(dr) {
                var e = expiryState(dr.licence, today);
                if (e.state !== 'valid') { var band = bandFor(e.days); if (band !== null) items.push({ kind: 'licence', ref: dr.id, label: dr.name + ' driver licence', date: dr.licence, days: e.days, band: band }); }
            });
            return items.sort(function(a, b) { return a.days - b.days; });
        }

        function buildDigest(companyName, items, appUrl) {
            var when = function(d) { return d < 0 ? ('expired ' + (-d) + ' day' + (-d === 1 ? '' : 's') + ' ago') : d === 0 ? 'expires today' : ('in ' + d + ' day' + (d === 1 ? '' : 's')); };
            var rows = items.map(function(i) { return '<tr><td>' + esc(i.label) + '</td><td>' + esc(i.date) + '</td><td>' + esc(when(i.days)) + '</td></tr>'; }).join('');
            var subject = companyName + ': ' + items.length + ' fleet reminder' + (items.length === 1 ? '' : 's') + (items[0] && items[0].days < 0 ? ' (some expired)' : '');
            var html = '<p>These items at <strong>' + esc(companyName) + '</strong> need attention:</p><table cellpadding="6" style="border-collapse:collapse"><thead><tr><th align="left">Item</th><th align="left">Date</th><th align="left">When</th></tr></thead><tbody>' + rows + '</tbody></table><p>Renew or update them under Documents, Maintenance or Drivers. You are emailed once per milestone (30, 14, 7 and 1 day before, and on the day).</p>' + (appUrl ? '<p><a href="' + esc(appUrl) + '">Open EIO</a></p>' : '');
            return { subject: subject, html: html };
        }

        /* ---------------- pageAll pattern ---------------- */
        function pageAll(make, size, max) {
            size = size || 1000; max = max || 50000; var out = [], skip = 0, batch;
            do { batch = make(skip, size); if (!batch || !batch.length) break; out = out.concat(batch); skip += size; } while (batch.length === size && skip < max);
            return out;
        }

        /* ---------------- seed ---------------- */
        var BRAND = 'EIO'; var KEY = 'eio.demo.v2';

        function seed() {
            var drivers = [
                ['Musa Danjuma', '0803 555 0110', iso(200), 'Active'],
                ['Emeka Obi', '0805 555 0111', iso(18), 'Active'],
                ['Tunde Adeyemi', '0806 555 0112', iso(-4), 'Active'],
                ['Ibrahim Sani', '0809 555 0113', iso(120), 'Active']
            ];
            var vehicles = [
                ['LSR-412AA', 'Truck', 'Own', '', 3.2, 125000],
                ['KTU-905BD', 'Truck', 'Own', '', 2.8, 81450],
                ['ABJ-118KM', 'Tanker', 'Attached', 's3', 3, 64000],
                ['KAN-220XY', 'Truck', 'Own', '', 3, 98000]

        /* ---------------- map ---------------- */
        function mapv() {
            var CITY = { Lagos: [3.4, 6.5], Ibadan: [3.9, 7.4], Benin: [5.6, 6.3], 'Port Harcourt': [7, 4.8], Enugu: [7.5, 6.4], Abuja: [7.5, 9.1], Kaduna: [7.4, 10.5], Kano: [8.5, 12], Maiduguri: [13.1, 11.8] };
            var pt = function(c) { return [(c[0] - 2.5) * 31, (14 - c[1]) * 31]; };
            var OUT = [[2.7, 6.4], [3.4, 6.4], [4.5, 6], [5.4, 5.4], [6, 4.3], [7, 4.4], [8.3, 4.5], [8.8, 4.7], [9.6, 6], [10.6, 7], [11.5, 7.2], [12, 8], [12.9, 9], [13.7, 10.6], [14.6, 11.5], [14.6, 12.6], [13.7, 13.6], [12.2, 13.4], [10.8, 13.3], [9, 13], [7.2, 13.5], [5.6, 13.8], [4.2, 13.5], [3.6, 11.8], [3.7, 10.3], [3.1, 9], [2.7, 7.8]];
            var L = D.bookings.filter(function(b) { return b.status === 'In transit' && CITY[b.from] && CITY[b.to]; });
            var pos = function(b, i) {
                var t = ((Date.now() / 50000) + i * 0.27 + 0.1) % 1;
                var a = pt(CITY[b.from] || CITY.Lagos), z = pt(CITY[b.to] || CITY.Kano);
                return [a[0] + (z[0] - a[0]) * t, a[1] + (z[1] - a[1]) * t, t];
            };
            if (SELECTED && !g('bookings', SELECTED)) SELECTED = null;
            var sel = SELECTED ? g('bookings', SELECTED) : (L[0] || null);
            if (sel) SELECTED = sel.id;
            var svg = '<svg viewBox="0 0 380 310" role="img" aria-label="Map of Nigeria with moving vehicles" style="width:100%;height:auto;background:var(--sf);border:1px solid var(--ln);border-radius:10px">';
            svg += '<polygon points="' + OUT.map(function(c) { return pt(c).join(','); }).join(' ') + '" fill="var(--bg)" stroke="var(--mu)" stroke-width="1.2"/>';
            L.forEach(function(b) {
                var a = pt(CITY[b.from] || CITY.Lagos), z = pt(CITY[b.to] || CITY.Kano);
                svg += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + z[0] + '" y2="' + z[1] + '" stroke="var(--br)" stroke-width="1.2" stroke-dasharray="4 3"/>';
            });
            Object.keys(CITY).forEach(function(n) {
                var c = pt(CITY[n]);
                svg += '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="3" fill="var(--mu)"/><text x="' + (c[0] + 5) + '" y="' + (c[1] + 3) + '" font-size="9" fill="var(--tx)">' + esc(n) + '</text>';
            });
            L.forEach(function(b, i) {
                var p = pos(b, i);
                svg += '<g class="tk" data-a="map-sel" data-id="' + b.id + '" style="cursor:pointer" transform="translate(' + p[0] + ' ' + p[1] + ')"><circle r="9" fill="var(--br)" stroke="#fff" stroke-width="2"/><text y="3.5" text-anchor="middle" font-size="9" fill="#fff">▶</text></g>';
            });
            svg += '</svg>';
            var h = '<div class="hd0"><div><h1>Live tracking</h1><small>Simulated positions from bookings. Production reads a GPS tracker feed.</small></div></div>';
            h += '<div class="mapgrid"><div>' + svg + '</div><div>';
            h += '<div class="card"><h2>Vehicles on the road</h2>';
            if (!L.length) h += '<p class="mu">No vehicles in transit.</p>';
            L.forEach(function(b) {
                h += '<button class="row" data-a="map-sel" data-id="' + b.id + '"><div><b>' + esc(lab('vehicles', b.vehicle)) + '</b><br><small>' + esc(b.from) + ' → ' + esc(b.to) + '</small></div>' + (SELECTED === b.id ? badge('Selected', 'g') : '') + '</button>';
            });
            h += '</div>';
            if (sel) {
                var v = g('vehicles', sel.vehicle), dr = g('drivers', sel.driver), c = g('customers', sel.customer);
                var p = pos(sel, L.indexOf(sel));
                h += '<div class="card"><h2>' + esc(v ? v.plate : '—') + ' · ' + esc(dr ? dr.name : '—') + '</h2>';
                h += '<div class="kv"><span>Customer</span><b>' + esc(c ? c.name : '—') + '</b></div><div class="kv"><span>Goods</span><b>' + esc(sel.goods) + '</b></div><div class="kv"><span>Route</span><b>' + esc(sel.from) + ' → ' + esc(sel.to) + '</b></div>';
                h += '<div class="kv"><span>Progress</span><b>' + Math.round(p[2] * 100) + '%</b></div>';
                h += '<div class="kv"><span>Speed</span><b>' + (Math.round(40 + p[2] * 30)) + ' km/h</b></div><div class="kv"><span>Ignition</span><b>On</b></div>';
                h += '<h3 style="margin-top:.7rem">Route history</h3>';
                var hist = D.bookings.filter(function(b) { return b.vehicle === sel.vehicle; }).sort(function(a, b) { return String(b.date).localeCompare(String(a.date)); });
                hist.forEach(function(b) { h += '<div class="kv"><span>' + esc(b.no) + ' ' + esc(b.from) + ' → ' + esc(b.to) + '</span><span>' + esc(b.date) + ' ' + badge(b.status) + '</span></div>'; });
                h += '</div>';
            }
            h += '</div></div>';
            return h;
        }

        /* ---------------- schedule ---------------- */
        function sched() {
            var d = new Date();
            d.setDate(1);
            d.setMonth(d.getMonth() + CM);
            var y = d.getFullYear(), mo = d.getMonth(), first = (d.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
            var ws = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            var h = '<div class="hd0"><div><h1>Booking schedule</h1><small>Click a booking to edit it.</small></div></div>';
            h += '<div class="bar2"><button class="btn" data-a="cm" data-d="-1">Previous</button><b style="flex:2;text-align:center">' + d.toLocaleString('en-GB', { month: 'long', year: 'numeric' }) + '</b><button class="btn" data-a="cm" data-d="1">Next</button></div>';
            h += '<div class="tw"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--ln);border:1px solid var(--ln);border-radius:10px;overflow:hidden">';
            ws.forEach(function(w) { h += '<div style="background:var(--sf);padding:4px;font-size:.7rem;color:var(--mu);font-weight:600;text-align:center">' + w + '</div>'; });
            for (var i = 0; i < first; i++) h += '<div style="background:var(--sf);min-height:78px"></div>';
            for (var n = 1; n <= days; n++) {
                var ds = y + '-' + String(mo + 1).padStart(2, '0') + '-' + String(n).padStart(2, '0');
                var bs = D.bookings.filter(function(b) { return b.date === ds; });
                h += '<div style="background:var(--sf);min-height:78px;padding:4px;font-size:11px;' + (ds === TD ? 'outline:2px solid var(--br);outline-offset:-2px' : '') + '"><b>' + n + '</b>';
                bs.slice(0, 2).forEach(function(b) { h += '<a class="ch" data-a="edit" data-m="bookings" data-id="' + b.id + '" style="display:block;background:var(--in2);color:var(--in);border-radius:4px;padding:1px 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:11px">' + esc(b.no) + ' ' + esc(b.to) + '</a>'; });
                if (bs.length > 2) h += '<span style="color:var(--bl);font-size:10px">+' + (bs.length - 2) + ' more</span>';
                h += '</div>';
            }
            h += '</div></div>';
            return h;
        }

                D.routes.forEach(function(r) { if (r.id === TR) route = r; });
                var ref = 'TK-' + (4001 + D.tickets.length);
                var seats = SEL.slice();
                seats.forEach(function(n, i) {
                    D.tickets.push({ id: 'tk' + uid() + i, route: TR, seat: n, who: val('who'), ref: seats.length > 1 ? ref + '-' + (i + 1) : ref, account: 'a1', amount: route.p, date: TD, in: false, mode: val('method') || 'Transfer', phone: val('phone') || '' });
                });
                SEL = [];
                HOLD = 0;
                save();
                showTicket(val('who'), seats, ref, route, val('method') || 'Transfer');
                render();
            } else if (kind === 'driver') {
                if (!val('name') || !val('licence')) { errBox(f, 'Name and licence expiry are required.'); return; }
                D.drivers.push({ id: 'd' + uid(), name: val('name'), phone: val('phone'), licence: val('licence'), status: val('status') || 'Active' });
                save(); closeSh(); render(); toast('Driver saved');
            } else if (kind === 'user') {
                if (!val('name') || val('email').indexOf('@') < 1) { errBox(f, 'Name and a valid email are required.'); return; }
                D.users.push({ id: 'u' + uid(), name: val('name'), email: val('email'), role: val('role') || 'Dispatcher', status: 'Active' });
                save(); closeSh(); render(); toast('User saved');
            } else if (kind === 'employee') {
                if (!val('name')) { errBox(f, 'Name is required.'); return; }
                D.employees.push({ id: 'p' + uid(), name: val('name'), role: val('role'), phone: val('phone'), salary: Number(val('salary')) || 0, joined: val('joined') || TD });
                save(); closeSh(); render(); toast('Employee saved');
            } else if (kind === 'account') {
                if (!val('name')) { errBox(f, 'Name is required.'); return; }
                D.accounts.push({ id: 'a' + uid(), name: val('name'), kind: val('kind') || 'Bank', opening: Number(val('opening')) || 0 });
                save(); closeSh(); render(); toast('Account saved');
            } else if (kind === 'route') {
                if (!val('n') || !Number(val('p'))) { errBox(f, 'Route name and a price are required.'); return; }
                D.routes.push({ id: 'r' + uid(), n: val('n'), t: val('t') || '07:00', bus: val('bus'), p: Number(val('p')) });
                save(); closeSh(); render(); toast('Route saved');
            } else if (kind === 'company') {
                if (!val('name')) { errBox(f, 'Company name is required.'); return; }
                D.co.name = val('name');
                D.co.tin = val('tin');
                D.co.phone = val('phone');
                D.co.address = val('address');
                D.co.city = val('city');
                save();
                render();
                toast('Company saved');
            } else if (kind === 'lists') {
                ['goods', 'expense', 'docs', 'payTypes'].forEach(function(k) {
                    if (els[k]) D.lists[k] = val(k).split('\n').map(function(x) { return x.trim(); }).filter(Boolean);
                });
                save();
                render();
                toast('Lists saved');
            }
        });

        /* ---------------- hold timer ---------------- */
        setInterval(function() {
            if (!HOLD || !SEL.length) return;
            var s = Math.round((HOLD - Date.now()) / 1000);
            if (s <= 0) { SEL = [];
                HOLD = 0;
                render();
                toast('Hold expired. Seats released.'); return; }
            var els = document.querySelectorAll('.card b');
            for (var i = 0; i < els.length; i++) {
                if (els[i].textContent.indexOf(':') !== -1 && els[i].previousElementSibling && els[i].previousElementSibling.textContent.indexOf('Held') !== -1) { els[i].textContent = holdLabel(); break; }
            }
        }, 1000);

        /* ---------------- router + render ---------------- */
        function render() {
            closeSh();
            var hash = location.hash.replace(/^#\/?/, '');
            if (hash.indexOf('book/') === 0) { document.body.dataset.public = '1';
                $('#ttl').textContent = 'Book a seat';
                $('#v').innerHTML = publicBook(hash.slice(5));
                $('#side').innerHTML = '';
                $('#tabs').innerHTML = ''; return; }
            if (hash.indexOf('pay/') === 0) { document.body.dataset.public = '1';
                $('#ttl').textContent = 'Pay invoice';
                $('#v').innerHTML = publicPay(hash.slice(4));
                $('#side').innerHTML = '';
                $('#tabs').innerHTML = ''; return; }
            if (hash.indexOf('waybill/') === 0) { waybill(hash.slice(8)); return; }
            if (hash.indexOf('invoice-sheet/') === 0) { invoiceSheet(hash.slice(14)); return; }
            if (hash === 'login') { ACT.signout(); return; }
            delete document.body.dataset.public;
            PAGE = hash || 'dashboard';
            var valid = ['dashboard', 'bookings', 'invoices', 'payments', 'customers', 'suppliers', 'vehicles', 'drivers', 'fuel', 'maintenance', 'documents', 'tyres', 'empPay', 'employees', 'travel', 'reports', 'accounts', 'expenses', 'bills', 'purchases', 'transfers', 'users', 'settings', 'plans', 'website', 'guide', 'intro', 'map', 'schedule', 'planned-offline', 'planned-whatsapp', 'planned-subs', 'planned-import'];
            if (valid.indexOf(PAGE) === -1) PAGE = 'dashboard'; if (PAGE === 'guide') { PAGE = 'dashboard'; history.replaceState(null, '', '#/dashboard'); setTimeout(openGuide, 0); }
            if (R === 'Driver' && ['dashboard', 'invoices', 'payments', 'customers', 'suppliers', 'vehicles', 'fuel', 'maintenance', 'documents', 'tyres', 'empPay', 'employees', 'reports', 'settings', 'plans', 'website', 'accounts', 'expenses', 'bills', 'purchases', 'transfers', 'users', 'map'].indexOf(PAGE) !== -1) PAGE = 'bookings';
            if (!can(PAGE)) PAGE = 'dashboard';
            chrome();
            var html = '';
            if (PAGE === 'dashboard') html = dash();
            else if (PAGE === 'bookings') html = listBookings();
            else if (PAGE === 'invoices') html = listInvoices();
            else if (PAGE === 'payments') html = listPayments();
            else if (PAGE === 'customers') html = listCustomers();
            else if (PAGE === 'suppliers') html = listSuppliers();
            else if (PAGE === 'vehicles') html = listVehicles();
            else if (PAGE === 'drivers') html = listDrivers();
            else if (PAGE === 'fuel') html = listFuel();
            else if (PAGE === 'maintenance') html = listMaintenance();
            else if (PAGE === 'documents') html = listDocuments();
            else if (PAGE === 'tyres') html = listTyres();
            else if (PAGE === 'empPay') html = listEmpPay(); else if (PAGE === 'employees') html = listEmployees();
            else if (PAGE === 'travel') html = travel();
            else if (PAGE === 'reports') { html = reports(); } else if (PAGE === 'accounts') html = listAccounts();
            else if (PAGE === 'expenses') html = listExpenses();
            else if (PAGE === 'bills') html = listBills();
            else if (PAGE === 'purchases') html = listPurchases();
            else if (PAGE === 'transfers') html = listTransfers();
            else if (PAGE === 'users') html = listUsers();
            else if (PAGE === 'settings') html = settings();
            else if (PAGE === 'plans') html = plans();
            else if (PAGE === 'website') html = website();
            else if (PAGE === 'guide') html = guide();
            else if (PAGE === 'intro') html = intro();
            else if (PAGE === 'map') html = mapv();
            else if (PAGE === 'schedule') html = sched();
            else if (PAGE.indexOf('planned-') === 0) html = plannedPage(TITLE[PAGE]);
            else html = '<div class="empty"><h3>Not found</h3><p><a href="#/dashboard">Back to dashboard</a></p></div>';
            $('#v').innerHTML = html;
            (function() { var vv = $('#v'); vv.classList.toggle('anim', LASTP !== PAGE); LASTP = PAGE; var fr = vv.querySelector('[data-a="row"],[data-a="trip"]'); var hd = vv.querySelector('.hd0'); if (fr && hd && !ro() && !vv.querySelector('.hint')) hd.insertAdjacentHTML('afterend', '<p class="hint">Tap a row to edit or delete it.</p>'); })();
            if (PAGE === 'reports') renderReport();
            var rp = $('#reptype');
            if (rp) rp.addEventListener('change', function() { REP = rp.value;
                render(); });
            var rc = $('#repcust');
            if (rc) rc.addEventListener('change', function() { REP_CUST = rc.value;
                renderReport(); });
            var rv = $('#repveh');
            if (rv) rv.addEventListener('change', function() { REP_VEH = rv.value;
                renderReport(); });
            var rd = $('#repdrv');
            if (rd) rd.addEventListener('change', function() { REP_DRV = rd.value;
                renderReport(); });
            var rf = $('#rf');
            if (rf) rf.addEventListener('change', function() { REP_RANGE.a = rf.value || REP_RANGE.a;
                renderReport(); });
            var rt = $('#rt');
            if (rt) rt.addEventListener('change', function() { REP_RANGE.b = rt.value || REP_RANGE.b;
                renderReport(); });
            window.scrollTo(0, 0);
        }
        window.addEventListener('hashchange', function() { render(); });

        /* ---------------- boot ---------------- */
        var h0 = location.hash.replace(/^#\/?/, '');
        if (h0) PAGE = h0.split('/')[0];
        if (!can(PAGE)) PAGE = 'dashboard';
        render();
        if (PAGE === 'map') setInterval(function() { if (location.hash.replace(/^#\/?/, '') === 'map') render(); }, 5000);
    </script>
</body>
</html>
